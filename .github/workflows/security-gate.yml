name: Approve production security evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character origin/main commit SHA reviewed for release
        required: true
        type: string
      attestation_base64:
        description: Base64 of the redacted security-gate attestation JSON (maximum 32 KiB decoded)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-gate-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  attest:
    name: Validate and attest zero Critical/High findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Verify exact origin/main target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kim-song-jun/meeting-wrapper"
          test "${#TARGET_SHA}" -eq 40
          case "$TARGET_SHA" in
            *[!0-9a-f]*)
              echo "target_sha must be exactly 40 lowercase hexadecimal characters" >&2
              exit 1
              ;;
          esac
          git fetch --no-tags --depth=1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"

      - name: Verify security attestation schema and redaction
        env:
          ATTESTATION_BASE64: ${{ inputs.attestation_base64 }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const encoded = process.env.ATTESTATION_BASE64 ?? "";
          if (encoded.length === 0 || encoded.length > 45_000 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
            throw new Error("attestation_base64 is empty, oversized, or not canonical base64");
          }
          const bytes = Buffer.from(encoded, "base64");
          if (bytes.length === 0 || bytes.length > 32 * 1024 || bytes.toString("base64") !== encoded) {
            throw new Error("decoded attestation must be canonical and no larger than 32 KiB");
          }

          let input;
          try {
            input = JSON.parse(bytes.toString("utf8"));
          } catch {
            throw new Error("attestation payload must be valid JSON");
          }
          const allowedKeys = [
            "completed_at",
            "critical_count",
            "deep_security_scan_sha256",
            "high_count",
            "manual_review_sha256",
            "redacted_finding_ids",
            "scan_tool",
            "scan_version",
            "schema_version",
            "target_sha",
          ].sort();
          if (input === null || typeof input !== "object" || Array.isArray(input) || Object.keys(input).sort().join("\n") !== allowedKeys.join("\n")) {
            throw new Error("attestation contains missing or unknown fields");
          }
          const sha256 = /^[0-9a-f]{64}$/;
          const canonicalTime = (value) =>
            typeof value === "string" &&
            !Number.isNaN(Date.parse(value)) &&
            new Date(value).toISOString() === value;
          if (input.schema_version !== 1 || input.target_sha !== process.env.TARGET_SHA) {
            throw new Error("attestation schema or target SHA does not match the dispatch");
          }
          if (!sha256.test(input.manual_review_sha256) || !sha256.test(input.deep_security_scan_sha256)) {
            throw new Error("both source report SHA-256 digests are required");
          }
          if (input.critical_count !== 0 || input.high_count !== 0) {
            throw new Error("production requires Critical=0 and High=0");
          }
          if (!canonicalTime(input.completed_at)) {
            throw new Error("completed_at must be a canonical UTC timestamp");
          }
          if (!/^[0-9A-Za-z._/-]{1,64}$/.test(input.scan_tool) || !/^[0-9A-Za-z._+-]{1,64}$/.test(input.scan_version)) {
            throw new Error("scan identity contains unsupported characters");
          }
          if (
            !Array.isArray(input.redacted_finding_ids) ||
            input.redacted_finding_ids.length > 256 ||
            input.redacted_finding_ids.some((id) => typeof id !== "string" || !/^[0-9A-Za-z._:-]{1,128}$/.test(id))
          ) {
            throw new Error("redacted finding IDs are invalid");
          }

          const output = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            target_sha: input.target_sha,
            manual_review_sha256: input.manual_review_sha256,
            deep_security_scan_sha256: input.deep_security_scan_sha256,
            scan_tool: input.scan_tool,
            scan_version: input.scan_version,
            completed_at: input.completed_at,
            critical_count: 0,
            high_count: 0,
            redacted_finding_ids: input.redacted_finding_ids,
            security_gate_run_id: Number(process.env.GITHUB_RUN_ID),
            dispatch_actor: process.env.GITHUB_ACTOR,
            gate_timestamp: new Date().toISOString(),
          };
          await writeFile("_security-gate.json", `${JSON.stringify(output, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Upload approved security gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-gate-${{ inputs.target_sha }}
          path: _security-gate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - name: Record redacted evidence digest
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Production security gate"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Evidence SHA-256: \`$(sha256sum _security-gate.json | cut -d' ' -f1)\`"
            echo "- Critical: 0"
            echo "- High: 0"
          } >> "$GITHUB_STEP_SUMMARY"
