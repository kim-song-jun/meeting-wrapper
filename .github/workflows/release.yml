name: Verify release candidate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact lowercase 40-character candidate commit SHA on main
        required: true
        type: string

concurrency:
  group: molroom-release-candidate-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VITE_ADAPTER: google
      VITE_ALLOWED_HD: ${{ vars.VITE_ALLOWED_HD }}
      VITE_DEPLOYMENT: production
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout the protected immutable release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: controller
          persist-credentials: false
          ref: refs/tags/molroom-release-controller-v1
      - name: Verify the protected annotated phase-one controller pin
        run: |
          set -euo pipefail
          expected_controller_sha="7ba2814f491dccee9462c7bf01958dd28600b048"
          test "$(git -C controller cat-file -t refs/tags/molroom-release-controller-v1)" = tag
          test "$(git -C controller rev-parse 'refs/tags/molroom-release-controller-v1^{}')" = "$expected_controller_sha"
          test "$(git -C controller rev-parse HEAD)" = "$expected_controller_sha"
      - name: Checkout the untrusted candidate as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.target_sha }}
      - name: Verify candidate identity on main without retaining checkout credentials
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = "$(git -C candidate rev-parse HEAD)"
          git -C candidate fetch --no-tags origin main
          test "$TARGET_SHA" = "$(git -C candidate rev-parse FETCH_HEAD)"
      - name: Build the exact pinned disposable toolchain
        run: |
          set -euo pipefail
          toolchain_image="molroom-candidate-toolchain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull=false --tag "$toolchain_image" - <<'DOCKERFILE'
          FROM node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
          RUN npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund \
            && test "$(npm --version)" = "11.17.0"
          DOCKERFILE
          printf '%s\n' "$toolchain_image" > "$RUNNER_TEMP/molroom-toolchain-image"
      - name: Verify candidate in the disposable container and promote only host-reinspected bytes
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/verified-release"
          container_name="molroom-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          toolchain_image="$(cat "$RUNNER_TEMP/molroom-toolchain-image")"
          mkdir -m 700 "$output_root"
          cleanup_image() { docker image rm -f "$toolchain_image" >/dev/null 2>&1 || true; }
          trap cleanup_image EXIT
          node controller/scripts/release-control.mjs run-candidate-sandbox \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-sha "$TARGET_SHA" \
            --container-name "$container_name" \
            --controller-root "$GITHUB_WORKSPACE/controller" \
            --image "$toolchain_image" \
            --output-root "$output_root"
          node controller/scripts/release-control.mjs verify-archive \
            --artifact-root "$output_root/artifact" \
            --candidate-sha "$TARGET_SHA" \
            --receipt-path "$output_root/receipt.json"
          cleanup_image
          trap - EXIT
      - name: Upload the complete verified candidate package as one rooted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/verified-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
