AWSTemplateFormatVersion: "2010-09-09"
Description: MolRoom private S3 and CloudFront production hosting

Parameters:
  DomainName:
    Type: String
    Default: molroom.molcube.com
    AllowedPattern: '^molroom\.molcube\.com$'
  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]+$'
  ActiveReleaseSha:
    Type: String
    Default: UNRELEASED
    AllowedPattern: '^(UNRELEASED|[0-9a-f]{40})$'
    Description: The only authoritative locator for the active immutable release prefix.
  DistributionEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  DistributionIsEnabled: !Equals [!Ref DistributionEnabled, "true"]

Resources:
  OriginBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub molroom-${AWS::AccountId}-${AWS::Region}-origin
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: MolRoom
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub molroom-${AWS::AccountId}-${AWS::Region}-cloudfront-logs
      AccessControl: LogDeliveryWrite
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCloudFrontAccessLogs
            Status: Enabled
            ExpirationInDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: MolRoom
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureLogTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CloudFrontLogBucket.Arn
              - !Sub ${CloudFrontLogBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: SigV4 access to the private MolRoom release bucket
        Name: molroom-production-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ReleaseCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Honor release object Cache-Control without forwarding viewer state
        DefaultTTL: 0
        MaxTTL: 31536000
        MinTTL: 0
        Name: molroom-release-cache
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: molroom-production-security-headers
        Comment: MolRoom browser security boundary
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com; form-action 'self' https://accounts.google.com; manifest-src 'self'; worker-src 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
            Preload: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin-allow-popups

  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: molroom-release-router
      FunctionConfig:
        Comment: Route the viewer to the ActiveReleaseSha prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var ACTIVE_RELEASE_SHA = "${ActiveReleaseSha}";
        var RELEASE_PREFIX = "/releases/" + ACTIVE_RELEASE_SHA;
        function handler(event) {
          var request = event.request;
          var uri = request.uri || "/";
          var lastSlash = uri.lastIndexOf("/");
          var lastSegment = uri.slice(lastSlash + 1);
          var isAssetPath = uri === "/assets" || uri.indexOf("/assets/") === 0;
          var isSpaRoute = !isAssetPath && (uri === "/" || uri.charAt(uri.length - 1) === "/" || lastSegment.indexOf(".") === -1);
          request.uri = isSpaRoute ? RELEASE_PREFIX + "/index.html" : RELEASE_PREFIX + (uri.charAt(0) === "/" ? uri : "/" + uri);
          return request;
        }
      Tags:
        - Key: Project
          Value: MolRoom
        - Key: ManagedBy
          Value: CloudFormation

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: Project
          Value: MolRoom
        - Key: ManagedBy
          Value: CloudFormation

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: MolRoom production SPA
        CustomErrorResponses:
          - ErrorCachingMinTTL: 0
            ErrorCode: 403
            ResponseCode: 404
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref ReleaseCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityResponseHeadersPolicy
          TargetOriginId: MolRoomPrivateOrigin
          ViewerProtocolPolicy: redirect-to-https
        Enabled: !If [DistributionIsEnabled, true, false]
        HttpVersion: http2and3
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt CloudFrontLogBucket.DomainName
          IncludeCookies: false
          Prefix: access/
        Origins:
          - DomainName: !GetAtt OriginBucket.RegionalDomainName
            Id: MolRoomPrivateOrigin
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: MolRoom
        - Key: ManagedBy
          Value: CloudFormation

  OriginBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyThisCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${OriginBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyMissingConditionalWriteHeader
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${OriginBucket.Arn}/releases/*
            Condition:
              Null:
                s3:if-none-match: "true"
              Bool:
                s3:ObjectCreationOperation: "true"
          - Sid: DenyWrongConditionalWriteHeader
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${OriginBucket.Arn}/releases/*
            Condition:
              Null:
                s3:if-none-match: "false"
              StringNotEquals:
                s3:if-none-match: "*"
              Bool:
                s3:ObjectCreationOperation: "true"
          - Sid: DenyReleaseObjectDeletion
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub ${OriginBucket.Arn}/releases/*
          - Sid: DenyOriginLifecycleMutation
            Effect: Deny
            Principal: "*"
            Action: s3:PutLifecycleConfiguration
            Resource: !GetAtt OriginBucket.Arn
          - Sid: DenyInsecureOriginTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt OriginBucket.Arn
              - !Sub ${OriginBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  IPv4Alias:
    Type: AWS::Route53::RecordSet
    Condition: DistributionIsEnabled
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A

  IPv6Alias:
    Type: AWS::Route53::RecordSet
    Condition: DistributionIsEnabled
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA

Outputs:
  ActiveReleaseSha:
    Value: !Ref ActiveReleaseSha
  DistributionEnabled:
    Value: !Ref DistributionEnabled
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  OriginBucketName:
    Value: !Ref OriginBucket
  CloudFrontLogBucketName:
    Value: !Ref CloudFrontLogBucket
