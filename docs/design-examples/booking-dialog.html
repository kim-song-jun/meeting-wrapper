<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MolRoom · 예약 다이얼로그 예시</title>
  <link rel="stylesheet" href="examples.css" />
</head>
<body>
  <span class="demo-note">정적 디자인 예시 · 예약 다이얼로그</span>
  <div class="app-shell" aria-hidden="true">
    <aside class="sidebar">
      <span class="brand-lockup"><img class="brand-mark" src="brand.svg" alt="" /><span>MolRoom</span></span>
      <nav class="side-nav"><span class="side-link active">예약 현황</span><span class="side-link">내 예약</span></nav>
      <section class="room-list">
        <h2 class="sidebar-section-title">회의실</h2>
        <p class="sidebar-hint">켠 회의실만 격자에 보여요.</p>
        <span class="room-row"><span class="room-dot"></span><span class="room-name">소회의실</span><span class="room-floor">3F</span></span>
        <span class="room-row"><span class="room-dot"></span><span class="room-name">대회의실</span><span class="room-floor">3F</span></span>
      </section>
    </aside>
    <main class="app-main">
      <div class="page-head"><div><h1 class="page-title">예약 현황</h1><p class="page-subtitle">비어 있는 시간을 고르면 예약을 시작해요.</p></div></div>
      <div class="calendar-toolbar"><span class="button quiet compact">오늘</span><strong class="period-title">7월 29일 (수)</strong><span class="grow"></span><div class="segmented"><span class="active">일</span><span>주</span><span>월</span></div></div>
      <section class="calendar-frame"><div class="calendar-board"><div class="corner-cell"></div><div class="room-head"><strong>소회의실</strong><span>3F</span></div><div class="room-head"><strong>대회의실</strong><span>3F</span></div><div class="time-axis"></div><div class="grid-column"><div class="event mine" style="top:144px;height:24px"><strong>11:00–11:30</strong><span>30분</span></div></div><div class="grid-column"><div class="event mine" style="top:144px;height:72px"><strong>성준</strong><span>11:00–12:30</span></div></div></div></section>
    </main>
  </div>

  <div class="dialog-backdrop" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="booking-title">
      <h2 id="booking-title">회의실 예약</h2>
      <p class="dialog-subtitle">소회의실 · 11:00–11:30 (30분)</p>

      <form class="form-stack">
        <div class="field">
          <label for="meeting-title">회의 제목</label>
          <input class="input" id="meeting-title" placeholder="주간 기획회의" />
          <p class="field-hint">격자에는 주최자만 보이고 제목은 표시되지 않아요</p>
        </div>
        <div class="field"><span class="label">인원</span><div class="choice-row"><span>−</span><strong>2명</strong><span>+</span></div><p class="field-hint">참석 인원 기록용 — 초대와 별개예요</p></div>
        <div class="field"><span class="label">추가 옵션 · Google Meet 자동 생성</span></div>
      </form>

      <div class="dialog-actions">
        <a class="button secondary" href="calendar.html">취소</a>
        <a class="button" href="my-bookings.html">예약하기</a>
      </div>
    </section>
  </div>
</body>
</html>
