<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MolRoom · 로그인 예시</title>
  <link rel="stylesheet" href="examples.css" />
</head>
<body>
  <span class="demo-note">정적 디자인 예시 · 로그인</span>
  <main class="auth-screen">
    <section class="auth-panel" aria-labelledby="login-title">
      <img class="brand-mark" src="brand.svg" alt="" />
      <h1 id="login-title">MolRoom</h1>
      <p class="auth-lead">회의실을 보고, 바로 예약해요.</p>
      <a class="button" href="calendar.html">Google 계정으로 계속</a>
      <p class="auth-domain">molcube.com 계정만 사용할 수 있어요.</p>
      <p class="auth-reassurance">
        <strong>별도 계정이나 비밀번호를 만들지 않아요.</strong><br />
        회사 Google 계정의 캘린더 권한만 사용해요.
      </p>
    </section>
  </main>
</body>
</html>
