<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MolRoom · 내 예약 예시</title>
  <link rel="stylesheet" href="examples.css" />
</head>
<body>
  <span class="demo-note">정적 디자인 예시 · 내 예약</span>
  <main class="mine-screen">
    <header class="mobile-app-head">
      <a class="brand-lockup" href="index.html">
        <img class="brand-mark" src="brand.svg" alt="" />
        <span>MolRoom</span>
      </a>
      <button class="text-action" type="button">로그아웃</button>
    </header>

    <div class="mine-content">
      <h1>내 예약</h1>
      <p class="user-line">성준 · sungjun@molcube.com · 관리자</p>

      <nav class="tabs" aria-label="예약 분류">
        <span class="tab active">내 예약</span>
        <span class="tab">지난 예약</span>
        <span class="tab">전체 예약</span>
        <span class="tab">설정</span>
      </nav>

      <h2 class="day-heading">오늘</h2>
      <section class="booking-list card" aria-label="오늘 내 예약">
        <article class="booking-item">
          <div class="booking-topline">
            <div>
              <h3 class="booking-room">대회의실</h3>
              <p class="booking-meta">11:00–12:30 (1시간 30분) · 인원 8명 · 초대 5명</p>
              <p class="booking-link">zoom.us/j/1234567890</p>
            </div>
          </div>
          <div class="booking-actions">
            <button class="button secondary" type="button">체크인하기</button>
            <button class="button danger" type="button">예약 취소</button>
            <p class="booking-reason">11:00부터 체크인할 수 있어요.</p>
          </div>
        </article>
        <article class="booking-item">
          <div class="booking-topline">
            <div>
              <h3 class="booking-room">소회의실</h3>
              <p class="booking-meta">14:00–15:00 (1시간) · 인원 6명 · 초대 6명</p>
            </div>
          </div>
          <div class="booking-actions">
            <button class="button secondary" type="button">체크인하기</button>
            <button class="button danger" type="button">예약 취소</button>
            <p class="booking-reason">14:00부터 체크인할 수 있어요.</p>
          </div>
        </article>
      </section>

      <h2 class="day-heading">내일</h2>
      <section class="booking-list card" aria-label="내일 내 예약">
        <article class="booking-item">
          <div class="booking-topline">
            <div>
              <h3 class="booking-room">소회의실</h3>
              <p class="booking-meta">14:00–15:00 (1시간) · 인원 6명 · 초대 6명</p>
            </div>
          </div>
          <div class="booking-actions">
            <button class="button danger" type="button">예약 취소</button>
          </div>
        </article>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="주요 화면">
      <a href="calendar.html">예약 현황</a>
      <a class="active" href="my-bookings.html" aria-current="page">내 예약</a>
    </nav>
  </main>
</body>
</html>
