  <style data-molroom-source="examples.css">
:root {
  color-scheme: light;
  --blue: #3182f6;
  --blue-hover: #2272eb;
  --blue-weak: #e8f3ff;
  --blue-weak-fg: #1b64da;
  --fg: #191f28;
  --body: #4e5968;

  --danger: #e42939;

  --warn-fg: #8f4b00;
  --backdrop: rgba(0, 0, 0, 0.48);
  --radius-action: 14px;
  --radius-action-mobile: 16px;
  --radius-input: 12px;
  --radius-filter: 12px;
  --radius-segment: 12px;
  --radius-nav-item: 12px;

* {

}

html,
body {

}

button,
input,
textarea,
select {

}

button,
a {

}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible {

h1,

p {

}

svg {

}

}

}

}

  background: var(--surface);
}

.sidebar {

.sidebar .brand-lockup {

}

.side-nav,

.side-link,

}

.room-row {

}

.side-link.active {

}

.sidebar-section-title {

.room-dot {

}

.room-name {

}

.room-floor {

}

.sidebar-user {

}

.sidebar-user strong,
.sidebar-user span {

}

}

.app-main {
  min-width: 0;

}

.mobile-topbar,
.mobile-bottom-nav {

}

.page-head {

  justify-content: space-between;

}

.page-title {

  line-height: 36px;
  font-weight: 700;
}

.page-subtitle {
  margin-top: 2px;

  font-size: 14px;
  line-height: 21px;
}

.button {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-action);
  background: var(--blue);
  color: #fff;
  font-size: 16px;
  font-weight: 650;
  text-decoration: none;
  white-space: nowrap;
}

.button.secondary {
  background: var(--blue-weak);
  color: var(--blue-weak-fg);
}

.button.quiet {
  background: var(--surface-muted);
  color: var(--body);
}

.button.danger {
  background: transparent;
  color: var(--danger);
}

.button.compact {
  min-height: 36px;
  padding: 0 14px;
  border-radius: var(--radius-action);
  font-size: 14px;
}

.segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--radius-segment);
  background: var(--surface-muted);
}

.segmented span {
  min-width: 44px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  border-radius: var(--radius-segment);
  color: var(--body);
  font-size: 14px;
  font-weight: 650;
}

.segmented .active {
  background: var(--surface);
  color: var(--fg);
}

.calendar-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.calendar-toolbar .grow {
  flex: 1;
}

.date-nav {
  display: flex;
  align-items: center;
  gap: 5px;
}

.icon-button {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--body);
  font-size: 20px;
}

.period-title {
  margin-left: 9px;
  font-size: 22px;
  line-height: 33px;
  font-weight: 700;
  white-space: nowrap;
}

.toolbar-hint {
  margin: 0 0 10px;
  color: var(--body);
  font-size: 13px;
  line-height: 18px;
}

.toolbar-hint strong {
  color: var(--fg);
}

.calendar-frame {
  overflow: hidden;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.calendar-board {
  display: grid;
  grid-template-columns: 58px repeat(2, minmax(220px, 1fr));
  grid-template-rows: 50px calc(var(--grid-slot) * 24);
  min-width: 760px;
}

.corner-cell,
.room-head {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.corner-cell {
  border-right: 1px solid var(--border);
}

.room-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  border-right: 1px solid var(--border);
}

.room-head:last-child {
  border-right: 0;
}

.room-head strong {
  font-size: 15px;
  font-weight: 650;
}

.room-head span {
  color: var(--body);
  font-size: 12px;
}

.time-axis {
  position: relative;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.time-label {
  position: absolute;
  right: 9px;
  transform: translateY(-7px);
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--axis-font-size);
  line-height: var(--axis-line-height);
}

.grid-column {
  position: relative;
  border-right: 1px solid var(--border);
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--grid-slot) * 2 - 1px),
      var(--border) calc(var(--grid-slot) * 2 - 1px),
      var(--border) calc(var(--grid-slot) * 2)
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--grid-slot) - 1px),
      var(--surface-muted) calc(var(--grid-slot) - 1px),
      var(--surface-muted) var(--grid-slot)
    );
}

.grid-column:last-child {
  border-right: 0;
}

.event {
  position: absolute;
  right: 8px;
  left: 8px;
  overflow: hidden;
  padding: 6px 8px 5px 12px;
  border: 0;
  border-radius: var(--radius-event);
  background: var(--surface-muted);
  color: var(--fg);
  font-size: var(--event-font-size);
  line-height: var(--event-line-height);
}

.event::before {
  content: "";
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  inline-size: 4px;
  background: var(--border-strong);
}

.event.mine {
  background: var(--blue-weak);
  color: var(--blue-weak-fg);
}

.event.mine::before {
  background: var(--blue);
}

.event.attention {
  background: var(--warn-bg);
  color: var(--warn-fg);
}

.event.attention::before {
  background: var(--warn-fg);
}

.event strong,
.event span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.event strong {
  font-weight: 700;
}

.event span {
  margin-top: 2px;
  opacity: 0.88;
}

.now-line {
  position: absolute;
  right: 0;
  left: 0;
  height: 1px;
  background: var(--color-now);
  z-index: 5;
}

.now-line::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -4px;
  width: 9px;
  height: 9px;
  border-radius: 999px;
  background: var(--color-now);
}

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background: var(--surface);
}

.auth-screen {

  background: var(--surface);
}

.auth-panel {

}

.auth-panel .brand-mark {

}

.auth-panel h1 {

.auth-panel .button {

}

.auth-domain {

.auth-reassurance {

.auth-reassurance strong {

}

.landing-page {

}

.landing-header {

}

}

.landing-header .brand-mark {

.text-action {

.landing-content {

.room-title {

.room-status {

.status-row {

.status-dot {

.section-label {

.mine-screen {

}

.gallery-image {
  display: block;
  width: 100%;
  max-height: 520px;
  object-fit: cover;
  object-position: top;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.gallery-meta {
  padding: 18px 20px 20px;
}

.gallery-meta h2 {
  font-size: 19px;
  line-height: 28px;
  font-weight: 700;
}

.gallery-meta p {
  margin-top: 5px;
  color: var(--body);
  font-size: 14px;
  line-height: 21px;
}

.gallery-links {
  display: flex;
  gap: 12px;
  margin-top: 14px;
}

.gallery-links a {
  color: var(--blue-weak-fg);
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
}

@media (min-width: 768px) and (hover: hover) and (pointer: fine) {
  :root {
    --grid-slot: var(--grid-slot-fine);
    --event-font-size: 12px;
    --event-line-height: 14px;
    --axis-font-size: 11px;
    --axis-line-height: 14px;
    --radius-event: var(--radius-event-fine);
  }
}

@media (max-width: 1023px) {
  .app-shell {
    display: block;
  }

  .sidebar {
    display: none;
  }

  .mobile-topbar {
    min-height: 60px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }

  .mobile-topbar .brand-lockup {
    font-size: 17px;
  }

  .mobile-topbar .brand-mark {
    width: 20px;
    height: 20px;
  }
}

@media (max-width: 767px) {
  .demo-note {
    display: none;
  }

  .app-main {
    padding: 18px 16px 104px;
  }

  .button {
    border-radius: var(--radius-action-mobile);
  }

  .mobile-bottom-nav {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .mobile-bottom-nav a {
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    color: var(--body);
    text-decoration: none;
    font-size: 14px;
    font-weight: 650;
  }

  .mobile-bottom-nav a.active {
    background: var(--blue-weak);
    color: var(--blue-weak-fg);
  }

  .page-head {
    display: block;
  }

  .page-title {
    font-size: 26px;
    line-height: 38px;
  }

  .calendar-toolbar {
    align-items: flex-start;
  }

  .calendar-toolbar .grow {
    flex-basis: 100%;
  }

  .gallery-page {
    padding: 28px 16px 48px;
  }

  .gallery-head h1 {
    font-size: 28px;
    line-height: 40px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
  }

  .gallery-card.wide {
    grid-column: auto;
  }

  .dialog-backdrop {
    align-items: end;
    padding: 0;
  }

  .dialog {
    max-height: 92vh;
    border-radius: var(--radius-dialog) var(--radius-dialog) 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }

  .field-row {
    grid-template-columns: 1fr;
  }
}
